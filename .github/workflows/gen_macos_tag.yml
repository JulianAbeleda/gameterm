name: macos_tag

on:
  push:
    tags:
      # Semver release tags (e.g. 0.1.3). Excludes date-style nightly tags and
      # component tags like vtparse-0.7.0.
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  build:
    runs-on: "macos-latest"
    
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # whisper.cpp (whisper-rs-sys, pulled in by the voice/STT feature) uses
      # std::filesystem, which is macOS 10.15+. The old wezterm-era 10.12 target
      # makes those symbols "unavailable" and fails the C++ build.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Name the zip/cask from the pushed tag (e.g. 0.1.3) instead of the
      # date-based default in ci/deploy.sh, so it matches the cask URL.
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - name: "Install Rust (ARM)"
        shell: bash
        run: "rustup target add aarch64-apple-darwin"
      - name: "Compile with sccache"
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Cache Rust Dependencies"
        uses: actions/cache@v4
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config
          key: "cargo-deps-${{ hashFiles('**/Cargo.lock') }}"
      - name: "Vendor dependecies"
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config"
      - name: "Install System Deps"
        shell: bash
        run: "env CI=yes PATH=$PATH ./get-deps"
      - name: "Build gameterm (Release mode ARM)"
        shell: bash
        run: "cargo build --target aarch64-apple-darwin -p gameterm --release"
      - name: "Build gameterm-gui (Release mode ARM)"
        shell: bash
        run: "cargo build --target aarch64-apple-darwin -p gameterm-gui --release"
      - name: "Build strip-ansi-escapes (Release mode ARM)"
        shell: bash
        run: "cargo build --target aarch64-apple-darwin -p strip-ansi-escapes --release"
      - name: "Install cargo-nextest from Cargo"
        uses: baptiste0928/cargo-install@v3
        with:
          crate: "cargo-nextest"
          cache-key: "macos"
      - name: "Test"
        shell: bash
        # Exclude the wezterm-inherited SFTP symlink e2e tests: creating a symlink
        # over SFTP fails (SftpError(4) = SSH_FX_FAILURE) in the GitHub runner's
        # sandbox, unrelated to the release. Every other test still gates the build.
        run: "cargo nextest run --all --no-fail-fast --target=aarch64-apple-darwin -E 'not test(/symlink_should_create_symlink_pointing_to/)'"
      - name: "Package"
        env:
          MACOS_APPLEID: ${{ secrets.MACOS_APPLEID }}
          MACOS_APP_PW: ${{ secrets.MACOS_APP_PW }}
          MACOS_CERT: ${{ secrets.MACOS_CERT }}
          MACOS_CERT_PW: ${{ secrets.MACOS_CERT_PW }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        shell: bash
        run: "bash ci/deploy.sh"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "macos"
          path: |
            GameTerm-*.zip
            gameterm.rb

  upload:
    runs-on: ubuntu-latest
    needs: build
    # No repository gate: this fork is the canonical repo, only its owner pushes
    # tags here, and the tap push needs a GH_PAT a random fork wouldn't have.
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v4
      - name: "Download artifact"
        uses: actions/download-artifact@v4
        with:
          name: "macos"
      - name: "Checksum"
        shell: bash
        run: "for f in GameTerm-*.zip ; do sha256sum $f > $f.sha256 ; done"
      # Publish the release first, using the built-in token, so it always
      # succeeds regardless of the optional tap-update step below.
      - name: "Create release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: "bash ci/retry.sh bash ci/create-release.sh ${{ github.ref_name }}"
      - name: "Upload to Tagged Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: "bash ci/retry.sh gh release upload --clobber ${{ github.ref_name }} GameTerm-*.zip *.sha256"
      # Best-effort: bump the Homebrew cask in the tap. Requires a GH_PAT secret
      # with write access to JulianAbeleda/homebrew-tap. If it's missing the
      # release above is unaffected; bump Casks/gameterm.rb manually.
      - name: "Checkout homebrew tap"
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: "JulianAbeleda/homebrew-tap"
          path: "homebrew-tap"
          token: "${{ secrets.GH_PAT }}"
      - name: "Update homebrew tap cask"
        continue-on-error: true
        shell: bash
        run: "cp gameterm.rb homebrew-tap/Casks/gameterm.rb"
      - name: "Commit homebrew tap changes"
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "gameterm ${{ github.ref_name }}"
          repository: "homebrew-tap"
